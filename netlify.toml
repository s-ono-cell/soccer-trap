# Netlify 構成設定ファイル
[build]
  command = "npm run build"
  publish = "dist"

# SPA（Single Page Application）用リライト設定
# ページ更新時や直接アクセス時の404エラーを防止します
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# セキュリティおよびキャッシュヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# 静的アセット（JS/CSS/画像）の長期キャッシュ（Viteがハッシュ付きファイル名を生成）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html は常に最新版を取得
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
